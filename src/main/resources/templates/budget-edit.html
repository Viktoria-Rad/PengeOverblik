<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rediger budget - PengeOverblik</title>
  <link rel="stylesheet" href="/css/dashboard.css">

  <style>
    .page-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .user-info{
      display:flex;
      align-items:center;
      gap:18px;
      font-size:15px;
    }

    .user-info span{
      color:#333;
    }

    .logout-link{
      text-decoration:none;
      font-weight:600;
      color:#555;
    }

    .logout-link:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">
    <h1>Penge<span>Overblik</span></h1>

    <nav>
      <a href="/dashboard">Overblik</a>
      <a href="/transactions">Transaktioner</a>
      <a class="active" href="/budget">Budget</a>
      <a href="/recurring-payments">Faste betalinger</a>
      <a href="/categories">Kategorier</a>
    </nav>
  </aside>

  <main class="content">

    <header class="page-header">

      <div>
        <h2>Rediger budget</h2>
        <p>Ret budgettet og gem ændringerne</p>
      </div>

      <div class="user-info">
        <span>
          Hej,
          <strong th:text="${userName}">Bruger</strong> 👋
        </span>

        <a href="/logout"
           class="logout-link"
           onclick="localStorage.removeItem('token')">
          Log ud
        </a>
      </div>

    </header>

    <p class="error-message"
       th:if="${param.error != null and param.error[0] == 'amount'}">
      Budgetbeløbet skal være større end 0.
    </p>

    <div class="panel">

      <form th:action="@{/budget/{id}/edit(id=${budget.id})}"
            method="post"
            class="transaction-form">

        <label for="amount">Beløb</label>

        <input type="number"
               id="amount"
               name="amount"
               step="0.01"
               min="0.01"
               th:value="${budget.amount}"
               required>

        <label for="month">Måned</label>

        <select id="month" name="month" required>
          <option value="1" th:selected="${budget.month == 1}">Januar</option>
          <option value="2" th:selected="${budget.month == 2}">Februar</option>
          <option value="3" th:selected="${budget.month == 3}">Marts</option>
          <option value="4" th:selected="${budget.month == 4}">April</option>
          <option value="5" th:selected="${budget.month == 5}">Maj</option>
          <option value="6" th:selected="${budget.month == 6}">Juni</option>
          <option value="7" th:selected="${budget.month == 7}">Juli</option>
          <option value="8" th:selected="${budget.month == 8}">August</option>
          <option value="9" th:selected="${budget.month == 9}">September</option>
          <option value="10" th:selected="${budget.month == 10}">Oktober</option>
          <option value="11" th:selected="${budget.month == 11}">November</option>
          <option value="12" th:selected="${budget.month == 12}">December</option>
        </select>

        <label for="year">År</label>

        <input type="number"
               id="year"
               name="year"
               th:value="${budget.year}"
               required>

        <label for="subcategoryId">Underkategori</label>

        <select id="subcategoryId"
                name="subcategoryId"
                required>

          <option th:each="subcategory : ${subcategories}"
                  th:value="${subcategory.id}"
                  th:text="${subcategory.name}"
                  th:selected="${budget.subcategory != null
                            && budget.subcategory.id == subcategory.id}">
          </option>

        </select>

        <div class="form-actions">

          <a href="/budget"
             class="cancel-button">
            Annuller
          </a>

          <button type="submit"
                  class="add-button">
            Gem ændringer
          </button>

        </div>

      </form>

    </div>

  </main>

</div>

</body>
</html>
