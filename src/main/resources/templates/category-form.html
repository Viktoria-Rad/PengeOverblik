<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tilføj kategori - PengeOverblik</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>Penge<span>Overblik</span></h1>
    <nav>
      <a href="/">Overblik</a>
      <a href="/transactions">Transaktioner</a>
      <a href="/budget">Budget</a>
      <a href="/recurring-payments">Faste betalinger</a>
      <a class="active" href="/categories">Kategorier</a>
    </nav>
  </aside>
  <main class="content">
    <header>
      <div>
        <h2>Tilføj kategori</h2>
        <p>Opret en ny hovedkategori</p>
      </div>
    </header>
    <div class="panel">
      <form action="/categories" method="post"
            class="transaction-form">
        <label for="name">Navn</label>
        <input type="text"
               id="name"
               name="name"
               placeholder="Fx Sundhed"
               required>
        <label for="type">Type</label>
        <select id="type"
                name="type"
                required>
          <option value="EXPENSE">
            Udgift
          </option>
          <option value="INCOME">
            Indkomst
          </option>
        </select>
        <div class="form-actions">
          <a href="/categories"
             class="cancel-button">
            Annuller
          </a>
          <button type="submit"
                  class="add-button">
            Gem kategori
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
