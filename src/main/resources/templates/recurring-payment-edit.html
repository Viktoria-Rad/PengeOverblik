<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rediger fast betaling - PengeOverblik</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>Penge<span>Overblik</span></h1>
    <nav>
      <a href="/dashboard">Overblik</a>
      <a href="/transactions">Transaktioner</a>
      <a href="/budget">Budget</a>
      <a class="active" href="/recurring-payments">Faste betalinger</a>
      <a href="/categories">Kategorier</a>
    </nav>
  </aside>

  <main class="content">
    <header>
      <div>
        <h2>Rediger fast betaling</h2>
        <p>Ret oplysningerne og gem ændringerne</p>
      </div>
    </header>
    <p class="error-message"
       th:if="${param.error != null and param.error[0] == 'amount'}">
      Beløbet skal være større end 0.
    </p>

    <p class="error-message"
       th:if="${param.error != null and param.error[0] == 'date'}">
      Næste betalingsdato kan ikke være før startdato.
    </p>
    <div class="panel">
      <form th:action="@{/recurring-payments/{id}/edit(id=${payment.id})}"
            method="post" class="transaction-form">

        <label for="name">Navn</label>
        <input type="text" id="name" name="name"
               th:value="${payment.name}" required>

        <label for="amount">Beløb</label>
        <input type="number" id="amount" name="amount"
               step="0.01" min="0.01"
               th:value="${payment.amount}" required>

        <label for="type">Type</label>
        <select id="type" name="type" required>
          <option value="EXPENSE"
                  th:selected="${payment.type.name() == 'EXPENSE'}">
            Udgift
          </option>
          <option value="INCOME"
                  th:selected="${payment.type.name() == 'INCOME'}">
            Indkomst
          </option>
        </select>

        <label for="frequency">Frekvens</label>
        <select id="frequency" name="frequency" required>
          <option value="WEEKLY" th:selected="${payment.frequency.name() == 'WEEKLY'}">Ugentligt</option>
          <option value="MONTHLY" th:selected="${payment.frequency.name() == 'MONTHLY'}">Månedligt</option>
          <option value="EVERY_2_MONTHS" th:selected="${payment.frequency.name() == 'EVERY_2_MONTHS'}">Hver 2. måned</option>
          <option value="EVERY_3_MONTHS" th:selected="${payment.frequency.name() == 'EVERY_3_MONTHS'}">Hver 3. måned</option>
          <option value="EVERY_6_MONTHS" th:selected="${payment.frequency.name() == 'EVERY_6_MONTHS'}">Hver 6. måned</option>
          <option value="YEARLY" th:selected="${payment.frequency.name() == 'YEARLY'}">Årligt</option>
          <option value="CUSTOM" th:selected="${payment.frequency.name() == 'CUSTOM'}">Andet</option>
        </select>

        <label for="startDate">Startdato</label>
        <input type="date" id="startDate" name="startDate"
               th:value="${payment.startDate}" required>

        <label for="nextPaymentDate">Næste betaling</label>
        <input type="date" id="nextPaymentDate" name="nextPaymentDate"
               th:value="${payment.nextPaymentDate}" required>

        <label for="subcategoryId">Underkategori</label>
        <select id="subcategoryId" name="subcategoryId" required>
          <option th:each="subcategory : ${subcategories}"
                  th:value="${subcategory.id}"
                  th:text="${subcategory.name}"
                  th:selected="${payment.subcategory != null && payment.subcategory.id == subcategory.id}">
          </option>
        </select>

        <div class="form-actions">
          <a href="/recurring-payments" class="cancel-button">Annuller</a>
          <button type="submit" class="add-button">Gem ændringer</button>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
