<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tilføj fast betaling - PengeOverblik</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .page-header{display:flex;justify-content:space-between;align-items:center;gap:20px}
    .user-info{display:flex;align-items:center;gap:16px;font-size:15px;white-space:nowrap}
    .user-info span{color:#333}
    .logout-link{text-decoration:none;font-weight:600;color:#555}
    .logout-link:hover{text-decoration:underline}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>Penge<span>Overblik</span></h1>
    <nav>
      <a href="/dashboard">Overblik</a>
      <a href="/transactions">Transaktioner</a>
      <a href="/budget">Budget</a>
      <a class="active" href="/recurring-payments">Faste betalinger</a>
      <a href="/categories">Kategorier</a>
    </nav>
  </aside>

  <main class="content">
    <header class="page-header">
      <div>
        <h2>Tilføj fast betaling</h2>
        <p>Opret en ny fast betaling</p>
      </div>
      <div class="user-info">
        <span>Hej, <strong th:text="${userName}">Bruger</strong> 👋</span>
        <a href="/logout" class="logout-link" onclick="localStorage.removeItem('token')">Log ud</a>
      </div>
    </header>

    <p class="error-message" th:if="${param.error != null and param.error[0] == 'amount'}">
      Beløbet skal være større end 0.
    </p>
    <p class="error-message" th:if="${param.error != null and param.error[0] == 'date'}">
      Næste betalingsdato kan ikke være før startdato.
    </p>

    <div class="panel">
      <form action="/recurring-payments" method="post" class="transaction-form">
        <label for="name">Navn</label>
        <input type="text" id="name" name="name" required>

        <label for="amount">Beløb</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0.01" required>

        <label for="type">Type</label>
        <select id="type" name="type" required>
          <option value="EXPENSE">Udgift</option>
          <option value="INCOME">Indkomst</option>
        </select>

        <label for="frequency">Frekvens</label>
        <select id="frequency" name="frequency" required>
          <option value="WEEKLY">Ugentligt</option>
          <option value="MONTHLY">Månedligt</option>
          <option value="EVERY_2_MONTHS">Hver 2. måned</option>
          <option value="EVERY_3_MONTHS">Hver 3. måned</option>
          <option value="EVERY_6_MONTHS">Hver 6. måned</option>
          <option value="YEARLY">Årligt</option>
          <option value="CUSTOM">Andet</option>
        </select>

        <label for="startDate">Startdato</label>
        <input type="date" id="startDate" name="startDate" required>

        <label for="nextPaymentDate">Næste betaling</label>
        <input type="date" id="nextPaymentDate" name="nextPaymentDate" required>

        <label for="subcategoryId">Underkategori</label>
        <select id="subcategoryId" name="subcategoryId" required>
          <option th:each="subcategory : ${subcategories}"
                  th:value="${subcategory.id}"
                  th:text="${subcategory.name}">
          </option>
        </select>

        <div class="form-actions">
          <a href="/recurring-payments" class="cancel-button">Annuller</a>
          <button type="submit" class="add-button">Gem betaling</button>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
