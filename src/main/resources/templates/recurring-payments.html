<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faste betalinger - PengeOverblik</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h1>Penge<span>Overblik</span></h1>
        <nav>
            <a href="/">Overblik</a>
            <a href="/transactions">Transaktioner</a>
            <a href="/budget">Budget</a>
            <a class="active" href="/recurring-payments">Faste betalinger</a>
            <a href="/categories">Kategorier</a>
        </nav>
    </aside>

    <main class="content">
        <header>
            <div>
                <h2>Faste betalinger</h2>
                <p>Dine faste og kommende betalinger</p>
            </div>

            <a href="/recurring-payments/new" class="add-button">
                + Tilføj fast betaling
            </a>
        </header>

        <div class="panel">
            <div th:if="${!payments.isEmpty()}">

                <div class="payment" th:each="payment : ${payments}">
                    <div>
                        <strong th:text="${payment.name}"></strong>

                        <p>
                            Næste betaling:
                            <span th:text="${#temporals.format(payment.nextPaymentDate, 'dd. MMMM yyyy')}"></span>
                        </p>

                        <p>
                            Frekvens:
                            <span th:text="${payment.frequency}"></span>
                        </p>
                    </div>

                    <div class="payment-actions">
                        <strong>
                            <span th:text="${payment.amount}"></span> kr.
                        </strong>

                        <a th:href="@{/recurring-payments/{id}/edit(id=${payment.id})}"
                           class="icon-button edit-icon"
                           title="Rediger"
                           aria-label="Rediger">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.04a1.003 1.003 0 0 0 0-1.42l-2.5-2.5a1.003 1.003 0 0 0-1.42 0l-1.96 1.96 3.75 3.75 2.13-1.79z"/>
                            </svg>
                        </a>

                        <form th:action="@{/recurring-payments/{id}/delete(id=${payment.id})}"
                              method="post">
                            <button type="submit"
                                    class="icon-button delete-icon"
                                    title="Slet"
                                    aria-label="Slet">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zm3-9h2v8H9v-8zm4 0h2v8h-2v-8zm2.5-6-1-1h-5l-1 1H5v2h14V4z"/>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>

            </div>

            <p th:if="${payments.isEmpty()}">
                Du har ingen faste betalinger.
            </p>
        </div>
    </main>
</div>
</body>
</html>
