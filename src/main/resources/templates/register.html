<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opret bruger - PengeOverblik</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111318;
            color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-wrapper {
            width: 100%;
            max-width: 460px;
            padding: 24px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
            font-size: 30px;
            font-weight: 800;
        }

        .logo .orange {
            color: #ff9f43;
        }

        .logo .yellow {
            color: #ffd45c;
        }

        .register-card {
            background: #1d2027;
            border: 1px solid #2b2f38;
            border-radius: 18px;
            padding: 34px;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        }

        .register-card h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #989da8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d8dbe2;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid #343945;
            background: #232731;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ffad45;
            box-shadow: 0 0 0 3px rgba(255, 173, 69, 0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff9f43, #ffd45c);
            color: #111318;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .message {
            min-height: 20px;
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }

        .login-link {
            margin-top: 22px;
            text-align: center;
            color: #8f949f;
            font-size: 14px;
        }

        .login-link a {
            color: #ffb64f;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="register-wrapper">

    <div class="logo">
        Penge<span class="orange">Over</span><span class="yellow">blik</span>
    </div>

    <div class="register-card">

        <h1>Opret bruger</h1>
        <p class="subtitle">Opret din konto og få dit eget økonomioverblik</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Navn</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit">Opret bruger</button>

        </form>

        <p id="message" class="message"></p>

        <div class="login-link">
            Har du allerede en konto?
            <a href="/login">Log ind</a>
        </div>

    </div>

</div>

<script>
    document.getElementById("registerForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const response = await fetch("/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                document.getElementById("message").textContent =
                    data.message || "Brugeren kunne ikke oprettes";
                return;
            }

            window.location.href = "/login";
        });
</script>

</body>
</html>
