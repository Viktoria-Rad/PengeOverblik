<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rediger underkategori - PengeOverblik</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>Penge<span>Overblik</span></h1>
    <nav>
      <a href="/dashboard">Overblik</a>
      <a href="/transactions">Transaktioner</a>
      <a href="/budget">Budget</a>
      <a href="/recurring-payments">Faste betalinger</a>
      <a class="active" href="/categories">Kategorier</a>
    </nav>
  </aside>

  <main class="content">
    <header>
      <div>
        <h2>Rediger underkategori</h2>
        <p>Ret navn eller hovedkategori</p>
      </div>
    </header>

    <div class="panel">
      <form th:action="@{/subcategories/{id}/edit(id=${subcategory.id})}"
            method="post" class="transaction-form">

        <label for="name">Navn</label>
        <input type="text" id="name" name="name"
               th:value="${subcategory.name}" required>

        <label for="categoryId">Hovedkategori</label>
        <select id="categoryId" name="categoryId" required>
          <option th:each="category : ${categories}"
                  th:value="${category.id}"
                  th:text="${category.name}"
                  th:selected="${subcategory.category.id == category.id}">
          </option>
        </select>

        <div class="form-actions">
          <a href="/categories" class="cancel-button">Annuller</a>
          <button type="submit" class="add-button">Gem ændringer</button>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
