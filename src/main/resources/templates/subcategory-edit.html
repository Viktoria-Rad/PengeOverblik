<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rediger underkategori - PengeOverblik</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .page-header{display:flex;justify-content:space-between;align-items:center;gap:20px}
    .user-info{display:flex;align-items:center;gap:16px;font-size:15px;white-space:nowrap}
    .user-info span{color:#333}
    .logout-link{text-decoration:none;font-weight:600;color:#555}
    .logout-link:hover{text-decoration:underline}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>Penge<span>Overblik</span></h1>
    <nav>
      <a href="/dashboard">Overblik</a>
      <a href="/transactions">Transaktioner</a>
      <a href="/budget">Budget</a>
      <a href="/recurring-payments">Faste betalinger</a>
      <a class="active" href="/categories">Kategorier</a>
    </nav>
  </aside>

  <main class="content">
    <header class="page-header">
      <div>
        <h2>Rediger underkategori</h2>
        <p>Ret navn eller hovedkategori</p>
      </div>
      <div class="user-info">
        <span>Hej, <strong th:text="${userName}">Bruger</strong> 👋</span>
        <a href="/logout" class="logout-link" onclick="localStorage.removeItem('token')">Log ud</a>
      </div>
    </header>

    <div class="panel">
      <form th:action="@{/subcategories/{id}/edit(id=${subcategory.id})}" method="post" class="transaction-form">
        <label for="name">Navn</label>
        <input type="text" id="name" name="name" th:value="${subcategory.name}" required>

        <label for="categoryId">Hovedkategori</label>
        <select id="categoryId" name="categoryId" required>
          <option th:each="category : ${categories}"
                  th:value="${category.id}"
                  th:text="${category.name}"
                  th:selected="${subcategory.category.id == category.id}">
          </option>
        </select>

        <div class="form-actions">
          <a href="/categories" class="cancel-button">Annuller</a>
          <button type="submit" class="add-button">Gem ændringer</button>
        </div>
      </form>
    </div>
  </main>
</div>
</body>
</html>
