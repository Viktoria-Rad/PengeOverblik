<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Transaktioner</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>Penge<span>Overblik</span></h1>
    <nav>
      <a th:href="@{/(month=${month}, year=${year})}">Overblik</a>
      <a class="active" th:href="@{/transactions(month=${month}, year=${year})}">Transaktioner</a>
      <a th:href="@{/budget(month=${month}, year=${year})}">Budget</a>
      <a href="/recurring-payments">Faste betalinger</a>
      <a href="/categories">Kategorier</a>
    </nav>
  </aside>

  <main class="content">
    <header>
      <div>
        <h2>Transaktioner</h2>
        <p>Alle dine registrerede transaktioner</p>
      </div>
      <a href="/transactions/new" class="add-button">+ Tilføj transaktion</a>
    </header>

    <p class="error-message"
       th:if="${param.error != null and param.error[0] == 'amount'}">
      Beløbet skal være større end 0.
    </p>

    <div class="panel month-selector">
      <form action="/transactions" method="get">
        <select name="month">
          <option value="1" th:selected="${month == 1}">Januar</option>
          <option value="2" th:selected="${month == 2}">Februar</option>
          <option value="3" th:selected="${month == 3}">Marts</option>
          <option value="4" th:selected="${month == 4}">April</option>
          <option value="5" th:selected="${month == 5}">Maj</option>
          <option value="6" th:selected="${month == 6}">Juni</option>
          <option value="7" th:selected="${month == 7}">Juli</option>
          <option value="8" th:selected="${month == 8}">August</option>
          <option value="9" th:selected="${month == 9}">September</option>
          <option value="10" th:selected="${month == 10}">Oktober</option>
          <option value="11" th:selected="${month == 11}">November</option>
          <option value="12" th:selected="${month == 12}">December</option>
        </select>

        <input type="number"
               name="year"
               th:value="${year}"
               min="2000"
               max="2100"
               required>

        <button type="submit" class="add-button">Vis</button>
      </form>

      <div class="currency-selector">
        <label for="currency">Valuta:</label>
        <select id="currency">
          <option value="DKK">DKK</option>
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
          <option value="UAH">UAH</option>
        </select>
      </div>
    </div>

    <div class="panel">
      <div class="transaction-row"
           th:each="transaction : ${transactions}">

        <div>
          <strong th:text="${transaction.description}"></strong>
          <p th:text="${transaction.date}"></p>
        </div>

        <div class="transaction-actions">
          <strong>
                        <span class="transaction-amount"
                              th:attr="data-amount=${transaction.amount}"
                              th:text="${#numbers.formatDecimal(transaction.amount,1,'POINT',2,'COMMA')}">
                        </span>
            <span class="currency-label">kr.</span>
          </strong>

          <a th:href="@{/transactions/{id}/edit(id=${transaction.id})}"
             class="icon-button edit-icon"
             title="Rediger"
             aria-label="Rediger">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.04a1.003 1.003 0 0 0 0-1.42l-2.5-2.5a1.003 1.003 0 0 0-1.42 0l-1.96 1.96 3.75 3.75 2.13-1.79z"/>
            </svg>
          </a>

          <form th:action="@{/transactions/{id}/delete(id=${transaction.id})}"
                method="post">
            <button type="submit"
                    class="icon-button delete-icon"
                    title="Slet"
                    aria-label="Slet">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zm3-9h2v8H9v-8zm4 0h2v8h-2v-8zm2.5-6-1-1h-5l-1 1H5v2h14V4z"/>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  const currencySelect = document.getElementById('currency');

  const currencySymbols = {
    DKK: 'kr.',
    EUR: '€',
    USD: '$',
    UAH: '₴'
  };

  const savedCurrency = localStorage.getItem('currency') || 'DKK';
  currencySelect.value = savedCurrency;

  async function updateCurrency(currency) {
    localStorage.setItem('currency', currency);

    let rate = 1;

    if (currency !== 'DKK') {
      const response = await fetch(`/api/currency?to=${currency}`);
      const data = await response.json();
      rate = Number(data.rate);
    }

    document.querySelectorAll('.transaction-amount').forEach(element => {
      const originalAmount = Number(element.dataset.amount);
      const convertedAmount = originalAmount * rate;

      element.textContent = new Intl.NumberFormat('da-DK', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(convertedAmount);
    });

    document.querySelectorAll('.currency-label').forEach(label => {
      label.textContent = currencySymbols[currency];
    });
  }

  currencySelect.addEventListener('change', function () {
    updateCurrency(currencySelect.value);
  });

  updateCurrency(savedCurrency);
</script>

</body>
</html>
